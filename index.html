<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Stillwater: a free, private, complete weight-loss companion. Everything stays on your device.">

<title>Stillwater – free weight-loss companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2346634D'/%3E%3Cpath d='M32 13s14 15 14 26a14 14 0 0 1-28 0c0-11 14-26 14-26z' fill='%23F6F1E4'/%3E%3C/svg%3E" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#F6F1E4;--bg2:#ECE9D9;--card:#FFFDF7;--ink:#27312A;--mute:#5F6A61;--line:#E4DFCE;--sage:#7E9C7A;--sage-d:#46634D;--sage-l:#DDE7D7;--sage-m:#B7CBB1;--clay:#B8704F;--gold:#C9A23F;--water:#5E97AB;--sleep:#8479B3;--field:#F3EFE2;--on:#fff;--h1:#4C6A54;--h2:#7A9A76;--shadow:0 12px 30px -20px rgba(45,70,50,.45);
--serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;--sans:ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121814;--bg2:#182019;--card:#1B241E;--ink:#E9EEE4;--mute:#9AA89C;--line:#2A362D;--sage:#8FB08B;--sage-d:#A9CBA4;--sage-l:#26342A;--sage-m:#3D5443;--clay:#E0997A;--gold:#E3C277;--water:#86B9CB;--sleep:#B0A8D6;--field:#212B24;--on:#10190F;--h1:#2B4331;--h2:#456B4C;--shadow:0 12px 30px -18px rgba(0,0,0,.7)}}
:root[data-theme=dark]{--bg:#121814;--bg2:#182019;--card:#1B241E;--ink:#E9EEE4;--mute:#9AA89C;--line:#2A362D;--sage:#8FB08B;--sage-d:#A9CBA4;--sage-l:#26342A;--sage-m:#3D5443;--clay:#E0997A;--gold:#E3C277;--water:#86B9CB;--sleep:#B0A8D6;--field:#212B24;--on:#10190F;--h1:#2B4331;--h2:#456B4C;--shadow:0 12px 30px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:400 16px/1.5 var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;font-variant-numeric:tabular-nums;padding-bottom:calc(92px + env(safe-area-inset-bottom,0))}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 40vmax at 100% -5%,color-mix(in srgb,var(--sage) 22%,transparent),transparent),radial-gradient(50vmax 40vmax at -10% 70%,color-mix(in srgb,var(--gold) 12%,transparent),transparent),linear-gradient(180deg,var(--bg),var(--bg2))}
main{max-width:680px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0)) 16px 24px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.2}
h1{font-size:1.9rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
.mute{color:var(--mute)}.sm{font-size:.85rem}.xs{font-size:.76rem}.b{font-weight:600}.c{text-align:center}
.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.g8{gap:8px}.g4{gap:4px}.f1{flex:1;min-width:0}
.mt{margin-top:14px}.mt8{margin-top:8px}.mb{margin-bottom:14px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.top .eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.datenav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.datenav button{border:0;background:none;color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.datenav button:hover{background:var(--field)}
.datenav .dl{font-weight:600;font-size:.9rem;padding:0 8px;min-width:86px;text-align:center;cursor:pointer;border-radius:99px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--ink);width:auto}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2:first-child,.card>.row:first-child>h2{margin-bottom:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card .hd h2{margin:0;display:flex;align-items:center;gap:8px}
.card .hd h2 svg{color:var(--sage-d)}
.hero{background:linear-gradient(150deg,var(--h1),var(--h2));color:#fff;border:0;border-radius:34px 34px 34px 10px;box-shadow:0 26px 44px -28px rgba(50,90,60,.9);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.hero .mute{color:rgba(255,255,255,.78)}
.hero .ringtxt b{color:#fff}
.hero .trio b{color:#fff}
.grid{display:grid;gap:14px}
.grid>.card{margin:0}
@media(min-width:960px){main{max-width:1000px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.cols>.card,.cols>div>.card{margin-bottom:14px}.cols>.full{grid-column:1/-1}}
/* buttons / inputs */
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--sage-d);color:var(--on);border:0;border-radius:999px;padding:11px 20px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--sage-d);border:1px solid var(--line)}
.btn.soft{background:var(--sage-l);color:var(--sage-d)}
.btn.danger{background:transparent;color:var(--clay);border:1px solid color-mix(in srgb,var(--clay) 40%,transparent)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn.full{width:100%}
.ib{background:none;border:0;cursor:pointer;color:var(--mute);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--field);color:var(--ink)}
.ib.on{color:var(--gold)}.ib.on svg{fill:var(--gold)}
.lnk{background:none;border:0;color:var(--sage-d);font-weight:600;cursor:pointer;padding:6px 4px;font-size:.9rem}
input,select,textarea{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--field);min-height:44px}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--sage-d);flex:none}
input[type=range]{padding:0;min-height:30px;accent-color:var(--sage-d)}
label{display:block;font-size:.82rem;color:var(--mute);font-weight:600;margin:12px 0 5px}
label.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--ink);font-size:1rem;font-weight:400;margin:0;padding:11px 0;border-top:1px solid var(--line)}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:6px 14px;font-size:.88rem;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--sage-d);border-color:var(--sage-d);color:var(--on)}
.seg{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 12px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--mute);min-height:38px;font-size:.86rem;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--sage-d);color:var(--on)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats.s2{grid-template-columns:1fr 1fr}.stats.s4{grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.stats.s4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--field);border-radius:18px;padding:12px 14px}
.stat b{display:block;font:500 1.35rem/1.2 var(--serif)}.stat span{color:var(--mute);font-size:.78rem}
.up{color:var(--sage-d)}.over{color:var(--clay)}
.bar{height:9px;border-radius:9px;background:var(--sage-l);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--sage);transition:width .6s}
.bar.over i{background:var(--clay)}
.nrow{margin:10px 0}.nrow .row{margin-bottom:5px;font-size:.9rem}
.ring{position:relative;display:grid;place-items:center}.ring svg{transform:rotate(-90deg)}
.rg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringtxt b{font:500 2.6rem/1 var(--serif)}.ringtxt span{font-size:.8rem;color:var(--mute)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px;margin-top:14px}
.trio b{display:block;font:500 1.25rem var(--serif)}.trio span{font-size:.78rem;opacity:.85}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.76rem;padding:3px 10px;border-radius:99px;background:var(--field);color:var(--mute);display:inline-flex;gap:4px;align-items:center}
.pill.ok{background:var(--sage-l);color:var(--sage-d)}
.msg{font:italic 400 1.05rem/1.45 var(--serif)}
/* lists */
.list{list-style:none;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list .t{flex:1;min-width:0;cursor:pointer}.list .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}.list .t small{color:var(--mute);display:block;font-size:.8rem}
.list .k{font-weight:600;font-size:.92rem;text-align:right;white-space:nowrap}
.meal{margin-bottom:10px;border:1px solid var(--line);border-radius:20px;padding:6px 14px 8px;background:var(--card)}
.meal .mh{display:flex;align-items:center;justify-content:space-between;padding:8px 0 2px}
.meal .mh h3{font-size:1rem}
.empty{color:var(--mute);font-size:.9rem;padding:8px 0}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--sage-l);color:var(--sage-d);font-weight:600}
.note{background:var(--sage-l);border-radius:16px;padding:12px 14px;font-size:.9rem;margin:10px 0;color:var(--ink)}
.note.warn{background:color-mix(in srgb,var(--clay) 16%,var(--card))}
.cups{display:flex;gap:6px;flex-wrap:wrap}
.cup{width:30px;height:42px;border-radius:6px 6px 13px 13px;border:2px solid var(--water);background:var(--field);overflow:hidden;position:relative}
.cup i{position:absolute;left:0;right:0;bottom:0;background:var(--water);opacity:.85;transition:height .5s}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.chk:first-of-type{border-top:0}
.chk i{width:26px;height:26px;border-radius:50%;border:2px solid var(--sage);display:grid;place-items:center;flex:none;color:var(--on);transition:background .2s}
.chk.d i{background:var(--sage-d);border-color:var(--sage-d)}.chk.d span{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--sage-m)}
.chk i svg{width:15px;height:15px;stroke-width:3;opacity:0}.chk.d i svg{opacity:1}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--field);border-radius:14px;padding:8px 2px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-size:.72rem;color:var(--mute);min-height:58px}
.scale button b{font-size:1.4rem;line-height:1.1}
.scale button[aria-pressed=true]{background:var(--sage-d);color:var(--on);border-color:var(--sage-d)}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;cursor:pointer;color:var(--sage-m);padding:4px}.stars button.on{color:var(--gold)}.stars button.on svg{fill:var(--gold)}
.stars svg{width:28px;height:28px}
/* charts */
.chart{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none}
.xr{min-height:1.5em;font-size:.86rem;color:var(--mute);margin-top:6px}.xr b{color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl th,.tbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-weight:400}.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl thead th{border:0;color:var(--mute);font-size:.76rem;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dh{font-size:.72rem;color:var(--mute);font-weight:600}
.cd{border-radius:14px;border:1px solid transparent;background:var(--field);cursor:pointer;display:grid;align-content:center;justify-items:center;font-size:.82rem;min-height:52px;padding:3px 0;color:var(--ink)}
.cd small{font-size:.66rem;color:var(--mute);line-height:1.1}.cd.e{visibility:hidden}.cd.t{border-color:var(--sage-d)}
.cd.dn{background:var(--sage-l)}.cd.up2{background:color-mix(in srgb,var(--clay) 18%,var(--field))}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}.hc{aspect-ratio:1;border-radius:6px;background:var(--field);border:1px solid var(--line)}
.hc.l1{background:color-mix(in srgb,var(--sage) 35%,var(--field))}.hc.l2{background:color-mix(in srgb,var(--sage) 65%,var(--field))}.hc.l3{background:var(--sage);border-color:var(--sage)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:20px;padding:12px;background:var(--field);display:grid;gap:3px;align-content:start}
.badge .bi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--mute);margin-bottom:4px;border:1px solid var(--line)}
.badge b{font:500 .95rem var(--serif)}.badge span{font-size:.78rem;color:var(--mute)}
.badge.on{background:linear-gradient(150deg,var(--sage-l),color-mix(in srgb,var(--gold) 22%,var(--card)));border-color:var(--sage-m)}
.badge.on .bi{background:linear-gradient(150deg,var(--sage),var(--gold));color:#fff;border:0}
.badge:not(.on){opacity:.75}
.track{position:relative;height:12px;border-radius:9px;background:rgba(255,255,255,.25);margin:22px 6px 12px}.track i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:#fff;transition:width .8s}.track b{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.3);transform:translate(-50%,-50%)}
.big{font:500 3.2rem/1 var(--serif);letter-spacing:-.03em}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph figure{margin:0;position:relative;border-radius:18px;overflow:hidden;background:var(--field);aspect-ratio:3/4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;color:#fff;font-size:.78rem;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.wk button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0;cursor:pointer;display:grid;justify-items:center;gap:2px;min-height:68px}
.wk button small{font-size:.68rem;color:var(--mute)}.wk button b{font:500 1.05rem var(--serif)}.wk button i{font-style:normal;font-size:.64rem;color:var(--sage-d);font-weight:600;min-height:1em}
.wk button[aria-pressed=true]{background:var(--sage-d);color:var(--on);border-color:var(--sage-d)}.wk button[aria-pressed=true] small,.wk button[aria-pressed=true] i{color:var(--on);opacity:.9}
.wk button.t:not([aria-pressed=true]){border-color:var(--sage-d)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0));display:flex;gap:2px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 16px 34px -14px rgba(25,50,35,.45);z-index:5;width:min(96vw,520px)}
nav button{flex:1;background:none;border:0;padding:7px 2px 5px;border-radius:999px;cursor:pointer;color:var(--mute);font-size:.66rem;font-weight:600;display:grid;justify-items:center;gap:2px;min-height:50px;transition:background .2s,color .2s}
nav button[aria-current=page]{background:var(--sage-d);color:var(--on)}
@media(min-width:960px){body{padding-bottom:30px;padding-left:96px}nav{left:14px;transform:none;top:50%;bottom:auto;margin-top:-170px;flex-direction:column;width:76px;border-radius:30px}nav button{padding:10px 2px;min-height:62px}}
/* modal */
.mo{position:fixed;inset:0;z-index:30;background:rgba(10,20,14,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:min(100%,560px);max-height:94vh;overflow:auto;background:var(--card);border-radius:30px 30px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0));border:1px solid var(--line);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.mo{align-items:center}.sheet{border-radius:30px}}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.search{position:relative}.search svg{position:absolute;left:13px;top:11px;color:var(--mute)}.search input{padding-left:40px}
.resl{max-height:42vh;overflow:auto;margin-top:6px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translate(-50%,-160%);background:var(--sage-d);color:var(--on);padding:11px 20px;border-radius:99px;z-index:40;font-weight:600;transition:transform .4s;max-width:92vw;text-align:center;font-size:.92rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.view>*{animation:rise .5s both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.welcome{min-height:80vh;display:grid;align-content:center}
.welcome h1{font-size:2.3rem}
.hl{display:inline-block;background:var(--sage-l);color:var(--sage-d);border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:700;letter-spacing:.04em}
.stars svg{width:26px;height:26px}.stars{gap:0}

.card{padding:16px;margin-bottom:12px}.meal{padding:4px 14px 6px}.list>li{padding:9px 0}.top{margin-bottom:10px}main{padding-top:calc(14px + env(safe-area-inset-top,0))}
.chips{gap:6px}.btn.full{min-height:46px}
@media(max-width:380px){.stats{gap:8px}.stat b{font-size:1.15rem}}

function barChart(o){const b=o.bars;if(!b.length)return'';const W=440,H=o.h||170,Lm=8,R=8,T=14,B=26,n=b.length,mx0=Math.max(...b.map(x=>x.v),o.goal||0,1),mx=mx0*1.12,bw=(W-Lm-R)/n,gap=Math.min(6,bw*.22),Y=v=>T+(1-v/mx)*(H-T-B);

 const bars=b.map((x,i)=>{const h=Math.max(x.v>0?2:0,(H-T-B)*x.v/mx),xx=Lm+i*bw+gap/2,met=o.goal!=null&&x.v>=o.goal;
  return`<rect x="${xx.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw-gap).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6,(bw-gap)/2)}" fill="${x.hl?'var(--gold)':o.color||'var(--sage)'}" opacity="${x.v?1:.25}"/><rect class="tip" x="${(Lm+i*bw).toFixed(1)}" y="${T}" width="${bw.toFixed(1)}" height="${H-T-B}" fill="transparent" data-tip="${esc(x.tip||'')}"/>${(i%every===0&&n-1-i>=every/2)||i===n-1?`<text x="${(xx+(bw-gap)/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(x.l)}</text>`:''}`}).join('');

const last7=k=>rangeDays(ak(k,-6),k);
function viewWellness(){const sg=V.seg.wellness,k=V.date,d=L(k),g=S.goals,
 head=`<div class="top"><div><p class="eyebrow">Beyond the food</p><h1>Wellness</h1></div></div>`,
 tabs=seg([['water','Water'],['sleep','Sleep'],['move','Move'],['habits','Habits'],['mind','Mind'],['goals','Goals']],sg,'seg-wellness'),dn=`<div class="mb">${dateNav(k)}</div>`;let b='';
 if(sg==='water')b=`<section class="card"><div class="row" style="gap:18px">${ring('wat',g.water?d.wa/g.water:0,{size:128,sw:13,color:'var(--water)',inner:`<b style="font-size:1.5rem">${wvNum(d.wa)}</b><span>of ${wvNum(g.water)} ${wvUnit()}</span>`})}<div class="f1"><p class="mute sm">${d.wa>=g.water?'Goal reached 💧':fw(Math.max(0,g.water-d.wa))+' to go'}</p><div class="cups mt8" aria-hidden="true">${[...Array(Math.min(12,Math.max(1,Math.round(g.water/S.set.bottles[0].ml))))].map((_,i)=>{const per=S.set.bottles[0].ml,f=clamp((d.wa-i*per)/per,0,1);return`<div class="cup"><i style="height:${f*100}%"></i></div>`}).join('')}</div></div></div>
  <div class="chips mt">${S.set.bottles.map(x=>`<button class="chip" data-a="water" data-v="${x.ml}">${ic('plus','s')} ${esc(x.n)} · ${fw(x.ml)}</button>`).join('')}<button class="chip" data-a="water" data-v="${-S.set.bottles[0].ml}" aria-label="Undo one">${ic('minus','s')}</button></div><div class="row mt"><button class="btn soft sm" data-a="waterset">${ic('edit','s')} Edit goal &amp; bottles</button></div></section>
  <section class="card"><div class="hd"><h2>Last 7 days</h2></div>${barChart({label:'Water, last 7 days',goal:wvNum(g.water),color:'var(--water)',bars:last7(k).map(x=>({l:fd(x,{weekday:'narrow'}),v:wvNum(L(x).wa),hl:x===k,tip:`<b>${fd(x,{weekday:'long',month:'short',day:'numeric'})}</b> · ${fw(L(x).wa)}`}))})}</section>`;
 if(sg==='sleep'){const sl=d.sl||{h:0,q:0},w=last7(k).filter(x=>L(x).sl);b=`<section class="card"><div class="hd"><h2>${ic('moon')} Last night</h2><span class="mute sm">Goal ${g.sleep} h</span></div><div class="row" style="justify-content:center;gap:14px"><button class="ib" data-a="sleep" data-v="-.25" aria-label="Less">${ic('minus')}</button><span class="big" style="font-size:3rem;min-width:140px;text-align:center">${r1(sl.h)}<span style="font-size:1.1rem"> hours</span></span><button class="ib" data-a="sleep" data-v=".25" aria-label="More">${ic('plus')}</button></div>${bar(sl.h,g.sleep,{color:'var(--sleep)'})}
  <p class="mt mb sm mute c">How restful was it?</p><div class="stars" style="justify-content:center">${[1,2,3,4,5].map(i=>`<button data-a="sleepq" data-v="${i}" class="${sl.q>=i?'on':''}" aria-label="${i} stars">${ic('star')}</button>`).join('')}</div></section>
  <section class="card"><div class="hd"><h2>Last 7 days</h2><span class="mute sm">${w.length?'avg '+r1(avg(w.map(x=>L(x).sl.h)))+' h':''}</span></div>${barChart({label:'Sleep, last 7 days',goal:g.sleep,color:'var(--sleep)',bars:last7(k).map(x=>({l:fd(x,{weekday:'narrow'}),v:L(x).sl?L(x).sl.h:0,hl:x===k,tip:`<b>${fd(x,{weekday:'long',month:'short',day:'numeric'})}</b> · ${L(x).sl?r1(L(x).sl.h)+' h · '+(L(x).sl.q||'–')+'/5':'no entry'}`}))})}</section>`}
 if(sg==='move')b=`<section class="card"><div class="hd"><h2>${ic('steps')} Steps</h2><span class="mute sm">Goal ${commas(g.steps)}</span></div><div class="row sp"><span class="big" style="font-size:2.6rem">${commas(d.st)}</span><div class="row g4"><button class="chip" data-a="steps" data-v="1000">+1,000</button><button class="chip" data-a="stepset">Set total</button></div></div>${bar(d.st,g.steps)}${barChart({label:'Steps, last 7 days',goal:g.steps,h:140,bars:last7(k).map(x=>({l:fd(x,{weekday:'narrow'}),v:L(x).st,hl:x===k,tip:`<b>${fd(x,{weekday:'long',month:'short',day:'numeric'})}</b> · ${commas(L(x).st)} steps`}))})}</section>
  <section class="card"><div class="hd"><h2>${ic('flame')} Exercise</h2><button class="btn sm" data-a="addex">${ic('plus','s')} Workout</button></div><div class="row sp"><span><b style="font:500 1.6rem var(--serif)">${exM(k)}</b> <span class="mute sm">/ ${g.ex} min · ${exK(k)} kcal</span></span></div>${bar(exM(k),g.ex)}${d.ex.length?`<ul class="list mt8">${d.ex.map(e=>`<li><div class="t"><b>${esc(e.t)}</b><small>${e.m} min · ${e.k} kcal</small></div><button class="ib" data-a="delex" data-v="${e.id}" aria-label="Delete">${ic('trash','s')}</button></li>`).join('')}</ul>`:'<p class="empty">No workouts logged for this day.</p>'}
  <p class="xs mute mt8">Calorie burn is an estimate from activity type, duration and your weight. Steps aren’t added to calories burned, to avoid double counting.</p></section>`;
 if(sg==='habits'){const hs=habOn();b=`<section class="card"><div class="hd"><h2>${ic('check')} Daily habits</h2><button class="btn soft sm" data-a="edithabits">${ic('edit','s')} Edit</button></div>${hs.length?hs.map(h=>`<button class="chk ${d.hb[h.id]?'d':''}" data-a="habit" data-v="${h.id}" aria-pressed="${!!d.hb[h.id]}"><i>${ic('check')}</i><span class="f1">${esc(h.n)}</span>${habStreak(h.id)>1?`<span class="pill ok">${ic('flame','s')} ${habStreak(h.id)}</span>`:''}</button>`).join(''):'<p class="empty">No habits yet. Add a few small ones.</p>'}</section>
  <section class="card"><div class="hd"><h2>Last 14 days</h2></div>${hs.length?rangeDays(ak(k,-13),k).map(x=>{const f=hs.filter(h=>L(x).hb[h.id]).length;return`<div class="row" style="padding:3px 0"><span class="xs mute" style="width:50px">${fd(x,{weekday:'short',day:'numeric'})}</span><div class="f1">${bar(f,hs.length)}</div><span class="xs mute" style="width:30px;text-align:right">${f}/${hs.length}</span></div>`}).join(''):''}</section>`}
 if(sg==='mind'){const sc=(key,arr,label,h)=>`<div class="mb"><p class="b mb">${label}</p><div class="scale" role="group" aria-label="${label}">${arr.map((m,i)=>`<button data-a="rate" data-v="${key}|${i+1}" aria-pressed="${d[key]===i+1}">${h?`<b>${m[0]}</b>`:`<b>${i+1}</b>`}${m[1]}</button>`).join('')}</div></div>`;
  const jr=Object.keys(S.log).filter(x=>S.log[x].jr&&x!==k).sort().reverse().slice(0,5);
  b=`<section class="card"><div class="hd"><h2>${ic('mind')} How are you today?</h2></div>${sc('md',MOODS,'Mood',1)}${sc('hu',HUNGER,'Hunger')}${sc('sr',STRESS,'Stress')}</section>
  <section class="card"><div class="hd"><h2>${ic('pen')} Journal</h2></div><textarea data-c="journal" data-i="journal" placeholder="What went well? What was hard? What do you want to remember?" aria-label="Journal">${esc(d.jr||'')}</textarea><p class="xs mute mt8">Saved automatically when you tap outside the box.</p>${jr.length?`<ul class="list mt8">${jr.map(x=>`<li><div class="t" data-a="gojr" data-v="${x}"><b>${fd(x,{weekday:'short',month:'short',day:'numeric'})}</b><small>${esc(S.log[x].jr.slice(0,90))}${S.log[x].jr.length>90?'…':''}</small></div></li>`).join('')}</ul>`:''}</section>
  <section class="card"><div class="hd"><h2>Mood &amp; stress, last 14 days</h2></div>${barChart({label:'Mood last 14 days',color:'var(--sage)',h:130,bars:rangeDays(ak(k,-13),k).map(x=>({l:fd(x,{month:'numeric',day:'numeric'}),v:L(x).md,tip:`<b>${fd(x)}</b> · mood ${L(x).md?MOODS[L(x).md-1][1]:'–'} · hunger ${L(x).hu||'–'}/5 · stress ${L(x).sr||'–'}/5`}))})}</section>`}
 if(sg==='goals')b=`<section class="card"><div class="hd"><h2>${ic('check')} Daily wellness goals</h2></div><form data-f="wgoals"><label style="margin-top:0">Water (${wvUnit()})</label><input name="water" inputmode="decimal" value="${wvNum(g.water)}"><div class="f3"><div><label>Sleep (h)</label><input name="sleep" inputmode="decimal" value="${g.sleep}"></div><div><label>Steps</label><input name="steps" inputmode="numeric" value="${g.steps}"></div><div><label>Exercise (min)</label><input name="ex" inputmode="numeric" value="${g.ex}"></div></div><button class="btn full mt">Save goals</button></form><p class="xs mute mt8">Habits are edited under the Habits tab. Nutrition goals live in Profile.</p></section>`;
 return head+tabs+(sg==='goals'?'':dn)+b}

function heightFields(p){if(p.sys==='me')return`<div><label>Height (cm)</label><input name="cm" inputmode="decimal" value="${esc(p.cm||'')}" required></div>`;return`<div><label>Height</label><div class="row g8"><input name="ft" inputmode="numeric" placeholder="ft" value="${esc(p.ft||'')}" aria-label="Feet" required><input name="inch" inputmode="decimal" placeholder="in" value="${esc(p.inch||'')}" aria-label="Inches"></div></div>`}
function profileFields(p,isNew){return`<div class="chips mb" role="group" aria-label="Units"><button type="button" class="chip" data-a="${isNew?'obsys':'psys'}" data-v="us" aria-pressed="${p.sys==='us'}">US (lb, ft)</button><button type="button" class="chip" data-a="${isNew?'obsys':'psys'}" data-v="me" aria-pressed="${p.sys==='me'}">Metric (kg, cm)</button></div>
 <label style="margin-top:0">First name</label><input name="name" value="${esc(p.name||'')}" placeholder="What should we call you?" autocomplete="given-name">
 <div class="f2"><div><label>Sex (for calorie math)</label><select name="sex">${[['f','Female'],['m','Male'],['x','Prefer not to say']].map(([v,l])=>`<option value="${v}" ${p.sex===v?'selected':''}>${l}</option>`).join('')}</select></div><div><label>Age</label><input name="age" inputmode="numeric" value="${esc(p.age||'')}" required></div></div>
 <div class="f2">${heightFields(p)}<div><label>Current weight (${p.sys==='me'?'kg':'lb'})</label><input name="w" inputmode="decimal" value="${esc(p.w||'')}" required></div></div>
 <div class="f2"><div><label>Goal weight (${p.sys==='me'?'kg':'lb'})</label><input name="gw" inputmode="decimal" value="${esc(p.gw||'')}" required></div>${isNew?'':`<div><label>Starting weight (${p.sys==='me'?'kg':'lb'})</label><input name="sw" inputmode="decimal" value="${esc(p.sw||'')}" required></div>`}<div><label>Activity level</label><select name="act">${ACTLV.map(a=>`<option value="${a[0]}" ${+p.act===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div></div>`}
function readProfile(fd0,sys){const v=k=>fd0.get(k)||'',err=[];const age=r0(num(v('age'))),us=sys==='us';
 const h=us?(num(v('ft'))*12+num(v('inch')))*2.54:num(v('cm')),w=num(v('w')),gw=num(v('gw')),kg=us?w/2.20462:w,gkg=us?gw/2.20462:gw;
 if(age<18||age>100)err.push('Stillwater is designed for adults (18+).');if(h<100||h>230)err.push('Please check your height.');if(kg<30||kg>350)err.push('Please check your current weight.');if(gkg<30||gkg>350)err.push('Please check your goal weight.');
 if(!err.length){const bmi=gkg/Math.pow(h/100,2);if(bmi<18.5){const mn=18.5*Math.pow(h/100,2);err.push(`That goal is below a healthy BMI range. For your height, please choose ${us?f1(mn*2.20462)+' lb':f1(mn)+' kg'} or more. A healthcare professional can help if you’d like to go lower.`)}}
 const sw=v('sw')?(us?num(v('sw'))/2.20462:num(v('sw'))):kg;return{err,p:{name:v('name').trim().slice(0,40),sys,sex:v('sex')||'f',age,h,start:sw,goal:gkg,act:+v('act')||1.375},kg}}
function viewWelcome(){const o=OB;return`<div class="welcome"><div class="c mb"><span class="hl">FREE · PRIVATE · NO ACCOUNT</span></div><h1 class="c">Welcome to Stillwater</h1><p class="mute c mt8 mb">A calm, complete weight-loss companion. Every feature is free, and your data never leaves this device.</p>
 <form class="card" data-f="onboard">${profileFields(o,true)}<label>Pace</label>${chips([[.5,'Gentle'],[1,'Steady'],[1.5,'Faster'],[2,'Max']].map(([v,l])=>[v,l+' · '+paceLbl(v)]),o.pace||1,'obpace')}<p class="xs mute mt8">We’ll set a daily calorie goal with built-in safety limits. You can change anything later.</p><div id="oberr"></div><button class="btn full mt">Start my journey</button></form>
 <button class="btn ghost full mb" data-a="loadsample">🎬 Explore with sample data</button>
 <p class="xs mute c">Stillwater is a tracking tool, not medical advice. Check with a healthcare professional before making big changes.</p></div>`}
function viewProfile(){const p=S.prof,g=S.goals,pl=plan(),T=targets(),pf={sys:p.sys,name:p.name,sex:p.sex,age:p.age,cm:r0(p.h),ft:Math.floor(p.h/2.54/12),inch:r1(p.h/2.54%12),w:f1(wd(curW())),gw:f1(wd(p.goal)),sw:f1(wd(p.start)),act:p.act},stale=S.set.lastBackup&&(Date.now()-S.set.lastBackup>12096e5),never=!S.set.lastBackup&&Object.keys(S.log).length>3;
 const sp=g.split;
 return`<div class="top"><div><p class="eyebrow">You &amp; your settings</p><h1>Profile</h1></div><span class="hl">100% FREE</span></div>
 <section class="card hero"><p style="font:500 1.5rem var(--serif)">${p.name?esc(p.name):'You'}</p><p style="opacity:.9">Every feature is unlocked, always. No ads, no subscriptions, no account. Your data stays on this device.</p></section>
 <div class="cols"><section class="card"><div class="hd"><h2>${ic('profile')} About you</h2></div><form data-f="profile">${profileFields(pf,false)}<button class="btn full mt">Save profile</button></form></section>
 <section class="card"><div class="hd"><h2>${ic('flame')} Nutrition goals</h2></div><form data-f="goalsn">${chips([['auto','Calculated for me'],['custom','My own number']],g.mode,'gmode')}
  ${g.mode==='auto'?`<div class="mt">${chips([[.5,paceLbl(.5)],[1,paceLbl(1)],[1.5,paceLbl(1.5)],[2,paceLbl(2)]],g.pace,'gpace')}</div>${g.pace>=2?'<div class="note mt">2 lb a week is the top of the generally recommended range. It works best with plenty of protein, sleep and a doctor’s okay if you have health conditions.</div>':''}<div class="stats s2 mt"><div class="stat"><b>${commas(pl.cal)}</b><span>Daily calories</span></div><div class="stat"><b>${commas(pl.tdee)}</b><span>Maintenance estimate</span></div></div>${pl.limited?`<div class="note warn">We held your goal at a safe floor (${pl.cal} kcal) rather than the full deficit you picked.</div>`:''}<p class="xs mute mt8">Mifflin-St Jeor estimate. Use it as a starting point and adjust to your real-world results.</p>`:`<label>Daily calories</label><input name="cal" inputmode="numeric" value="${g.cal}">`}
  <label>Macro split (% of calories)</label><div class="f3"><div><label class="xs">Protein %</label><input name="sp" inputmode="numeric" value="${sp.p}"></div><div><label class="xs">Carbs %</label><input name="sc" inputmode="numeric" value="${sp.c}"></div><div><label class="xs">Fat %</label><input name="sf" inputmode="numeric" value="${sp.f}"></div></div><p class="xs mute mt8">Targets: ${T.p} g protein · ${T.c} g carbs · ${T.f} g fat</p>
  <div class="f3"><div><label>Fiber (g)</label><input name="fi" inputmode="numeric" value="${g.fi}"></div><div><label>Sugar max (g)</label><input name="su" inputmode="numeric" value="${g.su}"></div><div><label>Sodium max (mg)</label><input name="na" inputmode="numeric" value="${g.na}"></div></div>
  <label class="opt" style="margin-top:10px"><span>Add exercise calories back to my budget</span><input type="checkbox" name="eb" ${S.set.eatBack?'checked':''}></label><button class="btn full mt">Save goals</button></form></section>
 <section class="card"><div class="hd"><h2>${ic('check')} Daily completion</h2></div><p class="mute sm mb">Choose what counts toward your daily completion ring.</p>${[['food','Food logged'],['water','Water goal'],['sleep','Sleep'],['weight','Weigh-in'],['steps','Steps'],['ex','Exercise'],['habits','Habits']].map(([k,l])=>`<label class="opt"><span>${l}</span><input type="checkbox" data-c="cmp" data-k="${k}" ${S.set.cmp[k]?'checked':''}></label>`).join('')}</section>
 <section class="card"><div class="hd"><h2>${ic('sun')} Appearance</h2></div>${chips([['system','Match device'],['light','Light'],['dark','Dark']],S.set.theme,'theme')}<p class="b mt mb sm">Color theme</p><div class="sw" role="group" aria-label="Color theme">${[['sage','Sage','#46634D','#7E9C7A'],['ocean','Ocean','#2F6677','#6FA3B5'],['lavender','Lavender','#5B4F94','#9A8FC4'],['rose','Rose','#96485A','#C98A94'],['sunset','Sunset','#8F5428','#CC9060'],['slate','Slate','#3F4D5C','#7D8B99']].map(([k,l,c,c2])=>`<button type="button" data-a="accent" data-v="${k}" aria-pressed="${(S.set.accent||'sage')===k}" aria-label="${l}"><i style="background:linear-gradient(135deg,${c} 50%,${c2} 50%)"></i>${l}</button>`).join('')}</div></section>
 <section class="card full"><div class="hd"><h2>${ic('download')} Save &amp; export</h2></div>${stale||never?`<div class="note warn">${never?'You haven’t downloaded a backup yet.':'It’s been over two weeks since your last backup.'} Browser data can be cleared, so keep a copy.</div>`:''}<p class="mute sm mb"><b>Saved automatically</b> on this device${S.savedAt?' · '+new Date(S.savedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}. A second copy is kept in your browser’s extra storage.${S.set.lastBackup?' Last backup file: '+new Date(S.set.lastBackup).toLocaleDateString()+'.':''}</p>
  <div class="chips"><button class="btn sm" data-a="export">${ic('download','s')} Download backup</button><button class="btn ghost sm" data-a="${S.demo?'exitsample':'loadsample'}">🎬 ${S.demo?'Exit sample data':'Try sample data'}</button><label class="btn ghost sm" style="margin:0;cursor:pointer">${ic('upload','s')} Restore backup<input type="file" accept=".json,application/json" data-c="import" hidden></label><button class="btn ghost sm" data-a="exportcsv">Export CSV</button><button class="btn ghost sm" data-a="exportreport">Progress report</button><button class="btn danger sm" data-a="reset">Erase everything</button></div>
  <p class="xs mute mt8">The backup (.json) holds everything, including photos, and restores on any device. The CSV opens in Excel or Sheets. The progress report is a printable summary you can save as a PDF or share.</p></section>
 <section class="card full"><div class="hd"><h2>About Stillwater</h2></div><p class="mute sm">Stillwater is free and always will be: no premium tier, no trials, no locked features. It works offline once loaded, and it runs entirely in your browser. Calorie and nutrition figures are estimates. This app is not medical advice. Please talk to a healthcare professional about your health.</p></section></div>`}

function genNpc(r,team,coach,base,paceFrac,used){
 let n;do{n=pick(r,FIRST)+' '+pick(r,LAST).charAt(0)+'.'}while(used.has(n));used.add(n);

 coachIds.forEach(c=>{const t=[];for(let i=0;i<N;i++)t.push(genNpc(r,c,COACHES[c],base,pf,used));out.push(t)});

function stepNpc(g,x,k,rank,N){

 if(x.a==='comp'){if(rank>N*.4)m*=1.2;else if(rank===0)m*=.93}

 if(x.a==='crash'&&k>6)bad=.25;
 if(x.a==='plat'){if(x.plat>0){m=.05;x.plat--}else if(x.pw){m=1.5;x.pw=0}else if(r()<.22){x.plat=1+(r()<.5?1:0);x.pw=1;m=.05}}

const REALKEY=KEY+'-real';
function buildSample(){
 const r=rng(20260);const N=BUILTIN.filter(f=>f.k>=40&&f.k<=450);
 const sd=defS();sd.prof={name:'Sample',sys:'us',sex:'f',age:34,h:168,start:86.2,goal:68,act:1.375,startDate:ak(today(),-42)};
 sd.goals.pace=1;sd.goals.water=1893;sd.set.bottles=[{n:'Glass',ml:237},{n:'Bottle',ml:473},{n:'Large',ml:946}];sd.demo=true;
 const DAYS=42,mk=(f,q)=>{const e={id:uid(),n:f.n,s:f.s||'',q,ref:f.id,rc:0};NK.forEach(k=>e[k]=f[k]||0);return e};
 for(let i=DAYS;i>=0;i--){const d=ak(today(),-i),prog=(DAYS-i)/DAYS;
  if(i===0||r()>.07)sd.weights[d]=86.2-prog*3.9+(r()-.5)*.9;
  if(i>0&&r()<.08)continue; // a few unlogged days
  const day=emptyDay();
  [['breakfast',2],['lunch',2],['dinner',2],['snack',1]].forEach(([m,n])=>{for(let j=0;j<n;j++)day.f[m].push(mk(N[Math.floor(r()*N.length)],r()<.8?1:1.5))});
  day.wa=Math.round(1300+r()*1300);day.sl={h:Math.round((5.6+r()*3)*10)/10,q:2+Math.floor(r()*4)};
  day.st=Math.round(3500+r()*8500);day.md=1+Math.floor(r()*5);day.hu=1+Math.floor(r()*5);day.sr=1+Math.floor(r()*5);
  if(r()<.4){const t=EXTYPES[Math.floor(r()*EXTYPES.length)],m=20+Math.floor(r()*40);day.ex.push({id:uid(),t:t[0],m,k:Math.round(t[1]*sd.prof.start*m/60)})}
  sd.habits.forEach(h=>{if(r()<.65)day.hb[h.id]=1});
  if(i===3)day.jr='Felt strong on the walk today. Meal prep on Sunday really helped.';
  sd.log[d]=day}
 for(let w=0;w<=5;w++){const o={};MEAS.forEach(([m],j)=>{o[m]=[86,102,98,31,58,34][j]-w*(.5+j*.1)});sd.meas[ak(today(),-7*(5-w))]=o}
 return sd}
async function loadSample(){
 if(!S.demo){let raw;try{raw=JSON.stringify(S);localStorage.setItem(REALKEY,raw)}catch(e){toast('Not enough browser storage to keep your data safe while previewing.');return}}
 S=buildSample();V.tab='today';V.date=today();V.pd=today();V.draft=null;V.aw=V.aw||15;
 checkAch(true);startGame('kind',true);applyTheme();await persistNow();V.anim=true;render();window.scrollTo(0,0);toast('Sample data loaded 🎬')}
async function exitSample(){
 let raw=null;try{raw=localStorage.getItem(REALKEY)}catch(e){}
 let back=null;if(raw){try{back=norm(JSON.parse(raw))}catch(e){}}
 S=back||defS();try{localStorage.removeItem(REALKEY)}catch(e){}
 V.tab='today';V.date=today();V.pd=today();V.draft=null;applyTheme();await persistNow();V.anim=true;render();window.scrollTo(0,0);toast(back&&back.prof?'Your data is back':'Sample data removed')}
